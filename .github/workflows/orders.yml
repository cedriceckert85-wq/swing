name: Alpaca-Order-Platzierung

on:
  # schedule: DEAKTIVIERT 2026-06-21 (Flotte 2.0: alles auf den Pi -> Orders laufen ueber die Pi-Session/Timer durchs Risk-Gate, nicht aus der Cloud). Manuell weiter via workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpaca-orders
  cancel-in-progress: false

jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Orders platzieren & syncen
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python scripts/alpaca_sync.py
      - name: Commit & Push (nur bei Änderung)
        run: |
          if git diff --quiet data/journal.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "alpaca-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/journal.json
          git commit -m "Alpaca-Orders $(TZ=Europe/Berlin date +%d.%m.%Y' '%H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
